# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

font_family      family="Maple Mono NL NF"
bold_font        family='Maple Mono NL NF' style='Bold'
italic_font      family='Maple Mono NL NF' style='Italic'
bold_italic_font family='Maple Mono NL NF' style='Bold Italic'
font_size        11.0

cursor_shape block
mouse_hide_wait 1

background_opacity 0.77
window_padding_width 0
remember_window_size 0

confirm_os_window_close 0
